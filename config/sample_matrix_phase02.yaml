  F_Zjets_mlm: "Z + 2,3,4 partons MLM (xqcut 10, qCut 19); 0/1-parton bins validated by F_Zjets_01j_check (50k); fake-factor on all jet pairs; HT filter rejected (pilot)"
  F_QCD_lla_mlm: "Zgamma + 1,2,3 partons MLM; 0-parton bin validated by F_QCD_lla_0j_check (50k); fake-factor per jet; HT filter rejected (pilot)"
  B_QCD_llaa_mlm: "split into B_QCD_llaa_0j, _1j, _2j_is1..4 (beam-1 parton class g | u c | d s b | antiquarks)"
  B_EW_llaajj: "split into B_EW_llaajj_is1..4 (beam-1 class u c | d s b | u~ c~ | d~ s~ b~); split closure on Z+2j -1.4% (pull -2.1) to be rechecked"
  I_llaajj: "event sample deferred (sigma only) pending decision D-P3"
  H_QCD_ZH_mlm: "nominal resonant QCD ZH (0-2j MLM); H_QCD_ZHjj_fixed (100k, validated v1 gridpack) kept as VBS-region cross-check, never added"
  H_ZH_tautau: "Z->tautau via ME decay chain + Pythia tau decays, 0-2j MLM"
  V_WZa_ZZa: "split into V_WZa, V_ZZa; require group_subprocesses False (MG5 setcuts error); sigma pending (batch)"
  measured_sigma_fb: {zll_0j: 1500000, lla_0j: 10080, llaa_0j_mgg90_190: 2.893, zh_0j_zll: 48.45, tt_dilep: 23470, tta_dilep: 85.67, ttaa_dilep_mgg90_190: 0.0949, twa_dilep: 13.07, ew_llajj: 35.6, zll_jj_ptj20: 211500, llajj_qcd_ptj20: 1775}
