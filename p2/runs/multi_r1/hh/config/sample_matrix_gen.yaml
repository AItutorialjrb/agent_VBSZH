- idx: 1
  name: S_HHjj_kV1_k2V1_kl1
  cls: signal
  role: basis
  model: sm_kVk2VkL-no_b_mass
  process: generate p p > h h j j QCD=0 QED=4
  generator_cuts:
    ptj: 20
    etaj: 5
    drjj: 0.4
    dynamical_scale_choice: 3
    deltaeta: 2.5
    xetamin: 200
  vbs_anypair_patch: true
  pythia_cmnd: py8_hh_bb.cmnd
  br_ledger:
  - B_bb@H1
  - B_bb@H2
