meta:
  process: HH(boosted VBF HH->4b)
  run: multi_r1
  seed_scheme: 1e6*3+1e4*11+J+1000*idx; J=0 gridpack,1 test,2 LHE closure
  n_mc_rule: 'signal: N>=max(50k, sigma*BR*3000/fb); backgrounds: effective-N policy (SPEC 4.3)'
br_inputs:
  B_bb:
    value: 0.5824
    source: LHC Higgs WG YR4 SM prediction at mH=125.0 GeV (= model mass; not 125.09), B(H->bb)=5.824E-01; PDG has no SM BR, cross-check closed; BR uncertainty = Phase-06 nuisance
  B_Zqq:
    value: 0.6991
    source: PDG 2024 B(Z->hadrons)=0.6991 (Z forced to q qbar, q=d,u,s,c,b, in PY8; PDG used directly, no MG5 width involved)
  B_Wqq:
    value: 0.6741
    source: PDG 2024 B(W->hadrons)=0.6741 (W forced hadronic in PY8)
  one:
    value: 1.0
    source: no BR factor (inclusive PY8 decays, or no decay)
